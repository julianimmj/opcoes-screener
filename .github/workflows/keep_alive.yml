name: Manter Streamlit Ativo

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Instalar Playwright
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Despertar Streamlit App (Navegador Headless)
        run: |
          python - << 'PYEOF'
          import asyncio
          import sys
          from playwright.async_api import async_playwright

          APPS = ['https://opcoes-screener.streamlit.app/']
          STAY_SECONDS = 25
          MAX_RETRIES = 2

          async def wake_app(browser, url):
              for attempt in range(1, MAX_RETRIES + 1):
                  print(f'\n{"="*60}')
                  print(f'App: {url} (tentativa {attempt}/{MAX_RETRIES})')
                  print(f'{"="*60}')

                  page = await browser.new_page()
                  try:
                      print('[1/3] Navegando para o app...')
                      response = await page.goto(url, wait_until='domcontentloaded', timeout=60_000)
                      status = response.status if response else 0
                      print(f'  HTTP Status: {status}')
                      print(f'  URL final: {page.url}')

                      print('[2/3] Aguardando app ficar pronto...')
                      await page.wait_for_timeout(10_000)
                      content = (await page.content()).lower()

                      if any(w in content for w in ['please wait', 'waking up', 'booting up', 'app is booting']):
                          print('  App esta despertando... aguardando ate 90s...')
                          try:
                              await page.wait_for_selector(
                                  'iframe[title="streamlitApp"], .stApp, [data-testid="stAppViewContainer"]',
                                  timeout=90_000
                              )
                              print('  App despertou com sucesso!')
                          except Exception:
                              print('  Timeout no despertar — mas a visita ja ativou o wake-up.')

                      print(f'[3/3] Mantendo sessao ativa por {STAY_SECONDS}s...')
                      await page.wait_for_timeout(STAY_SECONDS * 1000)

                      final_title = await page.title()
                      print(f'  Titulo: {final_title}')
                      print(f'  RESULTADO: Visita concluida com sucesso!')
                      return True

                  except Exception as e:
                      print(f'  ERRO (tentativa {attempt}): {e}')
                      if attempt < MAX_RETRIES:
                          print(f'  Aguardando 10s antes de tentar novamente...')
                          await asyncio.sleep(10)
                  finally:
                      await page.close()

              print(f'  AVISO: Nao foi possivel visitar {url} apos {MAX_RETRIES} tentativas.')
              return False

          async def main():
              async with async_playwright() as p:
                  browser = await p.chromium.launch(headless=True)
                  success = 0
                  fail = 0
                  for url in APPS:
                      ok = await wake_app(browser, url)
                      if ok:
                          success += 1
                      else:
                          fail += 1
                  await browser.close()

              print(f'\n{"="*60}')
              print(f'Resumo: {success} sucesso(s), {fail} falha(s)')
              print(f'{"="*60}')

              # Nunca retorna exit(1) — o objetivo e apenas visitar,
              # nao validar se o app carregou 100%.
              # Mesmo uma visita parcial ja aciona o wake-up do Streamlit Cloud.

          asyncio.run(main())
          PYEOF
