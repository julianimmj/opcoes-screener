name: Manter Streamlit Ativo

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Instalar dependencias
        run: pip install requests

      - name: Despertar Streamlit App (Session + Health Check)
        run: |
          python - << 'PYEOF'
          import requests
          import time
          import sys

          urls = ['https://opcoes-screener.streamlit.app/']

          session = requests.Session()
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36',
              'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8',
              'Accept-Language': 'pt-BR,pt;q=0.9,en-US;q=0.8,en;q=0.7',
          })

          success_count = 0
          fail_count = 0

          for url in urls:
              print(f'\n{"="*60}')
              print(f'App: {url}')
              print(f'{"="*60}')
              
              try:
                  print('[1/3] Carregando pagina principal...')
                  resp = session.get(url, timeout=90, allow_redirects=True)
                  chain = [r.status_code for r in resp.history]
                  print(f'  Status: {resp.status_code} | Redirects: {chain}')
                  
                  if resp.status_code == 200:
                      body = resp.text[:1000].lower()
                      is_waking = any(w in body for w in ['please wait', 'waking', 'booting up'])
                      
                      if is_waking:
                          print('  App despertando... aguardando 45s...')
                          time.sleep(45)
                          resp = session.get(url, timeout=90)
                          print(f'  Status pos-despertar: {resp.status_code}')
                      
                      print('  Pagina principal carregada!')

                  print('[2/3] Verificando health endpoint...')
                  time.sleep(5)
                  health_url = url.rstrip('/') + '/_stcore/health'
                  health_resp = session.get(health_url, timeout=60)
                  print(f'  Health status: {health_resp.status_code}')
                  
                  print('[3/3] Segundo acesso para confirmar atividade...')
                  time.sleep(10)
                  resp2 = session.get(url, timeout=60)
                  print(f'  Status: {resp2.status_code}')
                  
                  if resp.status_code == 200:
                      success_count += 1
                      print(f'  RESULTADO: App ativo!')
                  else:
                      fail_count += 1
                      print(f'  RESULTADO: Possivel falha')
                      
              except requests.exceptions.Timeout:
                  fail_count += 1
                  print(f'  RESULTADO: Timeout')
              except Exception as e:
                  fail_count += 1
                  print(f'  RESULTADO: Erro - {e}')

          print(f'\n{"="*60}')
          print(f'Resumo: {success_count} sucesso(s), {fail_count} falha(s)')
          print(f'{"="*60}')
          
          if fail_count > 0:
              sys.exit(1)
          PYEOF
